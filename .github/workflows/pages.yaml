# Render the Quarto book and deploy to GitHub Pages.
# Triggered on push to master and on manual dispatch.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

name: pages

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::tidyverse
            any::devtools
            any::DiagrammeR
            any::plm
            any::naniar
            any::psych
            any::here
            any::ggridges
            local::.
          needs: website

      - name: Render Quarto book
        run: quarto render quarto_book

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: quarto_book/_book
          clean: true
          clean-exclude: |
            .nojekyll

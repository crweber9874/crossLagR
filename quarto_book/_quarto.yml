project:
  type: book
  output-dir: _book
  pre-render: scripts/clear_render_cache.R

book:
  title: "crossLagR"
  subtitle: "SEM Panel data models for the social sciences"

  author:
    - Christopher Weber
    - Adam Panish
    - Bang Zheng
  date: today
  chapters:
    - index.qmd
    - 00_Install.qmd
    - 01_Panel_Models.qmd
    - 02_Bias.qmd
    - 03_Identification.qmd
    - 04_RICLPM.qmd
    - 05_Change.qmd
    - 06_Unified.qmd
  appendices:
    - A_package_reference.qmd
#
bibliography:
  - book.bib
  - packages.bib
link-citations: true

execute:
  cache: false
  # `freeze: auto` only invalidates when the qmd source changes, so edits to
  # external R sources (R/clpmBias.R, etc.) silently use frozen output and
  # the page goes stale. `freeze: false` forces re-execution on every render.
  # Chunk-level `cache: true` still works for re-render speed on slow blocks.
  freeze: false

format:
  html:
    theme: cosmo
    toc: true
